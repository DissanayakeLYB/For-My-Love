<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff5f4" />
  <title>For My Sudu Bole 💗</title>
  <style>
    :root {
      --ink: #46343d;
      --muted: #8b737d;
      --rose: #df7895;
      --rose-deep: #bc5277;
      --cream: #fffaf6;
      --blush: #fff0f2;
      --line: rgba(155, 91, 113, .14);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 26px 16px 32px;
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 8% 10%, rgba(255, 210, 220, .58), transparent 34%),
        radial-gradient(ellipse at 92% 12%, rgba(255, 226, 194, .55), transparent 30%),
        linear-gradient(150deg, #fff8f4 0%, #fff0f4 54%, #fff9f1 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-text-size-adjust: 100%;
    }

    button, label { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { width: min(840px, 100%); margin: auto; }
    .heading { text-align: center; padding: 8px 10px 18px; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--rose-deep);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 7vw, 4.3rem);
      line-height: 1.04;
      font-weight: 500;
      letter-spacing: -.045em;
    }
    h1 em { color: var(--rose-deep); font-weight: 500; }
    .intro {
      max-width: 490px;
      margin: 13px auto 0;
      color: var(--muted);
      font-size: .98rem;
      line-height: 1.65;
    }

    .scene {
      isolation: isolate;
      position: relative;
      height: clamp(300px, 46vh, 390px);
      min-height: 300px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.96), rgba(255,248,246,.84) 47%, rgba(255,229,235,.78) 100%);
      box-shadow: 0 18px 55px rgba(160, 94, 116, .12), inset 0 1px 0 #fff;
    }
    .scene::before, .scene::after {
      content: "♡";
      position: absolute;
      color: rgba(213, 116, 148, .22);
      font-family: Georgia, serif;
      pointer-events: none;
      z-index: 0;
    }
    .scene::before { font-size: 70px; top: 23px; left: 8%; transform: rotate(-15deg); }
    .scene::after { content: "✦"; font-size: 30px; bottom: 28px; right: 10%; color: rgba(221, 165, 111, .4); }

    .scene-note {
      position: absolute;
      z-index: 1;
      top: 20px;
      left: 12px;
      right: 12px;
      text-align: center;
      color: #a1848d;
      font-size: .77rem;
      letter-spacing: .015em;
      pointer-events: none;
    }
    .person {
      --size: clamp(106px, 22vw, 150px);
      position: absolute;
      z-index: 3;
      width: var(--size);
      height: var(--size);
      left: 0;
      top: 50%;
      padding: 0;
      border: 5px solid rgba(255,255,255,.98);
      border-radius: 50%;
      background: #ffe3e9;
      box-shadow: 0 9px 25px rgba(150, 76, 104, .2), 0 0 0 1px rgba(222, 142, 165, .14);
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: left 720ms cubic-bezier(.2,.85,.25,1.22), top 720ms cubic-bezier(.2,.85,.25,1.22), transform 720ms cubic-bezier(.2,.85,.25,1.22), box-shadow 250ms ease;
      outline: none;
    }
    .person:focus-visible { box-shadow: 0 0 0 4px rgba(214, 106, 142, .25), 0 9px 25px rgba(150, 76, 104, .2); }
    .person.is-moving {
      z-index: 6;
      cursor: grabbing;
      transition: none;
      box-shadow: 0 15px 30px rgba(150, 76, 104, .28), 0 0 0 5px rgba(255,255,255,.5);
    }
    .person-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; position: relative; }
    .person.is-moving .person-inner { animation: running-bob 170ms ease-in-out infinite alternate; }
    .person img { display: none; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .person.has-photo img { display: block; }
    .placeholder {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: linear-gradient(145deg, #ffe9ed, #fbd0dd);
      color: #9c5a73;
    }
    .her .placeholder { background: linear-gradient(145deg, #fff0d9, #ffdbe4); }
    .person.has-photo .placeholder { display: none; }
    .placeholder .emoji { font-size: clamp(2.7rem, 7vw, 4rem); line-height: 1.08; filter: drop-shadow(0 3px 1px rgba(131,72,91,.1)); }
    .placeholder .short-name { font-size: .61rem; font-weight: 800; letter-spacing: .13em; }
    .person-tag {
      position: absolute;
      z-index: 7;
      top: calc(50% + clamp(72px, 14vw, 88px));
      min-width: 82px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255,255,255,.84);
      color: #8a596b;
      font-size: .75rem;
      font-weight: 750;
      text-align: center;
      box-shadow: 0 4px 12px rgba(154, 91, 116, .08);
      pointer-events: none;
      transform: translateX(-50%);
      transition: left 720ms cubic-bezier(.2,.85,.25,1.22), top 720ms ease, opacity 200ms ease;
      white-space: nowrap;
    }
    .hug-arms {
      display: none;
      position: absolute;
      z-index: 5;
      left: 50%; top: calc(50% + 32px);
      width: 170px; height: 75px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .hug-arms::before, .hug-arms::after {
      content: ""; position: absolute; top: 0; width: 92px; height: 50px;
      border: 10px solid #e88ba7; border-top-color: transparent;
      border-radius: 0 0 48px 48px;
      filter: drop-shadow(0 2px 1px rgba(142, 71, 96, .09));
    }
    .hug-arms::before { left: 0; transform: rotate(12deg); }
    .hug-arms::after { right: 0; transform: rotate(-12deg); border-color: #d86e91; border-top-color: transparent; }
    .scene.hugging .hug-arms { display: block; animation: arms-pop 520ms cubic-bezier(.2,1.35,.4,1) both; }
    .scene.hugging .person { box-shadow: 0 10px 27px rgba(150, 76, 104, .2), 0 0 0 4px rgba(255,255,255,.7); }
    .scene.hugging .you { z-index: 3; }
    .scene.hugging .her { z-index: 4; }
    .scene.hugging .person-tag { opacity: 0; }
    .scene.hugging .you .person-inner { animation: rush-left 720ms cubic-bezier(.2,.85,.25,1.1) both; }
    .scene.hugging .her .person-inner { animation: rush-right 720ms cubic-bezier(.2,.85,.25,1.1) both; }

    .heart-burst { position: absolute; z-index: 8; left: 50%; top: 50%; pointer-events: none; }
    .burst-heart {
      position: absolute; left: 0; top: 0; font-size: var(--heart-size, 21px);
      animation: heart-float 1250ms ease-out var(--delay, 0ms) both;
      filter: drop-shadow(0 2px 2px rgba(160, 71, 103, .12));
    }
    .scene.hugging .scene-note { color: #b36581; font-weight: 700; }
    @keyframes running-bob { from { transform: translateY(-2px) rotate(-2deg); } to { transform: translateY(3px) rotate(2deg); } }
    @keyframes rush-left { 0% { transform: scale(.88) rotate(-12deg); } 35% { transform: scale(1.06) rotate(7deg); } 70% { transform: scale(.98) rotate(-4deg); } 100% { transform: scale(1.03) rotate(-2deg); } }
    @keyframes rush-right { 0% { transform: scale(.88) rotate(12deg); } 35% { transform: scale(1.06) rotate(-7deg); } 70% { transform: scale(.98) rotate(4deg); } 100% { transform: scale(1.03) rotate(2deg); } }
    @keyframes arms-pop { 0% { opacity: 0; transform: translateX(-50%) scale(.45); } 80% { opacity: 1; transform: translateX(-50%) scale(1.08); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
    @keyframes heart-float {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.45) rotate(-10deg); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1.2) rotate(18deg); }
    }

    .controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin: 17px 0 14px; }
    .bring-button {
      min-height: 49px; padding: 0 23px; border: 0; border-radius: 99px;
      background: linear-gradient(135deg, #d96e91, #c75880); color: white;
      font-weight: 800; letter-spacing: .01em; cursor: pointer;
      box-shadow: 0 9px 20px rgba(193, 78, 118, .22);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .bring-button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(193, 78, 118, .27); }
    .bring-button:active { transform: translateY(1px) scale(.99); }
    .photo-label {
      display: inline-flex; justify-content: center; align-items: center; gap: 7px;
      min-height: 44px; padding: 0 15px; border: 1px solid rgba(196, 132, 151, .28);
      border-radius: 99px; background: rgba(255,255,255,.68); color: #936477;
      font-size: .84rem; font-weight: 700; cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }
    .photo-label:hover { background: #fff; transform: translateY(-1px); }
    input[type="file"] { display: none; }
    .tiny-help { text-align: center; color: #a58b95; font-size: .76rem; margin: 0 0 19px; }

    .message-card {
      position: relative; padding: 22px clamp(18px, 5vw, 38px) 23px;
      background: rgba(255,255,255,.76); border: 1px solid rgba(255,255,255,.96);
      border-radius: 24px; text-align: center;
      box-shadow: 0 12px 35px rgba(160, 94, 116, .085);
      min-height: 145px;
    }
    .message-kicker { margin: 0 0 9px; color: #c26b89; font-size: .68rem; font-weight: 850; letter-spacing: .18em; text-transform: uppercase; }
    .message {
      margin: 0 auto; max-width: 680px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 3.1vw, 1.55rem); line-height: 1.52; color: #5b3f4a;
      text-wrap: pretty;
    }
    .message-card.revealed .message { animation: message-in 500ms ease both; }
    @keyframes message-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .signature { margin: 13px 0 0; color: #ab7a8d; font-size: .83rem; font-weight: 650; }
    .closing { margin: 17px 8px 0; text-align: center; color: #a1848d; font-size: .83rem; line-height: 1.6; }
    .closing span { color: #cc688b; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 430px) {
      body { padding: 17px 11px 24px; }
      .heading { padding-bottom: 15px; }
      .intro { font-size: .9rem; }
      .scene { border-radius: 24px; height: 320px; }
      .person { --size: clamp(100px, 27vw, 125px); }
      .person-tag { top: calc(50% + 68px); }
      .controls { gap: 8px; }
      .photo-label { min-height: 41px; padding: 0 12px; font-size: .79rem; }
      .bring-button { min-height: 46px; padding: 0 19px; }
      .message-card { border-radius: 21px; padding-top: 20px; padding-bottom: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    /* The page starts with only the playful drag prompt and our two fixed photos. */
    body {
      align-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }
    .page { width: min(760px, 100%); margin: auto; }
    .scene { height: clamp(330px, 58vh, 470px); min-height: 330px; }
    .scene-note { top: 19px; font-size: .82rem; color: #9c7180; }
    .person { transition: left 720ms cubic-bezier(.2,.85,.25,1.22), top 720ms cubic-bezier(.2,.85,.25,1.22), transform 720ms cubic-bezier(.2,.85,.25,1.22), box-shadow 250ms ease; }
    .person img { display: none; }
    .person.has-photo img { display: block; }
    .person.has-photo .placeholder { display: none; }
    .scene.hugging .person { pointer-events: none; }
    .scene.hugging .scene-note { color: #b36581; font-weight: 800; }

    .message-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: rgba(74, 39, 54, .28);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    .message-overlay.is-open { display: flex; animation: overlay-in 220ms ease both; }
    .popup-card {
      position: relative; width: min(540px, 100%); max-height: min(78vh, 650px);
      max-height: min(78svh, 650px);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: clamp(25px, 5vw, 38px) clamp(20px, 5vw, 35px) 24px;
      border: 1px solid rgba(255,255,255,.98); border-radius: 27px;
      text-align: center; background: rgba(255, 251, 250, .97);
      box-shadow: 0 24px 85px rgba(94, 40, 62, .28), inset 0 1px 0 white;
      animation: popup-in 420ms cubic-bezier(.2,.95,.3,1.15) both;
    }
    .popup-heart { margin: 0 0 13px; font-size: 1.55rem; line-height: 1; }
    .message {
      margin: 0 auto; max-width: 460px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.1rem, 3.1vw, 1.38rem); line-height: 1.62; color: #5b3f4a;
      text-wrap: pretty;
    }
    .one-more-button {
      margin-top: 23px; min-height: 44px; max-width: 100%; padding: 0 20px;
      border: 1px solid rgba(192, 93, 127, .35); border-radius: 99px;
      background: rgba(255, 255, 255, .75); color: var(--rose-deep);
      font-size: .88rem; font-weight: 600; letter-spacing: .01em; cursor: pointer;
      box-shadow: 0 4px 12px rgba(193, 78, 118, .1);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .one-more-button:hover { transform: translateY(-1px); background: #fff; box-shadow: 0 7px 16px rgba(193, 78, 118, .16); }
    .one-more-button:active { transform: scale(.98); }
    .one-more-button:focus-visible { outline: 3px solid rgba(214, 106, 142, .3); outline-offset: 3px; }
    @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popup-in { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (max-width: 430px) {
      body { padding: max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
      .scene { height: min(62svh, 430px); min-height: 315px; border-radius: 24px; }
      .person { --size: clamp(104px, 29vw, 130px); }
      .popup-card { border-radius: 23px; }
    }

  </style>
</head>
<body>
  <main class="page">
    <section class="scene" id="scene" aria-label="Drag either photo toward the other to make us hug">
      <div class="scene-note" id="sceneNote">Psst… drag either of us closer 💞</div>

      <div class="person you" id="you" role="button" tabindex="0" aria-label="Pooh bear. Drag me toward Sudu bole." title="Drag me toward Sudu bole">
        <div class="person-inner">
          <div class="placeholder"><span class="emoji" aria-hidden="true">🧸</span><span class="short-name">POOH</span></div>
          <img src="images/pooh.jpg" alt="Pooh bear" draggable="false" />
        </div>
      </div>

      <div class="person her" id="her" role="button" tabindex="0" aria-label="Sudu bole. Drag me toward Pooh bear." title="Drag me toward Pooh bear">
        <div class="person-inner">
          <div class="placeholder"><span class="emoji" aria-hidden="true">💗</span><span class="short-name">SUDU</span></div>
          <img src="images/sudu.jpeg" alt="Sudu bole" draggable="false" />
        </div>
      </div>

      <div class="hug-arms" aria-hidden="true"></div>
      <div class="heart-burst" id="heartBurst" aria-hidden="true"></div>
    </section>
  </main>

  <div class="message-overlay" id="messageOverlay" aria-hidden="true">
    <section class="popup-card" role="dialog" aria-modal="true" aria-label="A loving message from Pooh bear">
      <p class="popup-heart" aria-hidden="true">🧸 💗</p>
      <p class="message" id="message" aria-live="polite"></p>
      <button class="one-more-button" id="oneMoreButton" type="button">drag for another hug ↺</button>
    </section>
  </div>

  <script>
    (() => {
      const scene = document.getElementById('scene');
      const you = document.getElementById('you');
      const her = document.getElementById('her');
      const sceneNote = document.getElementById('sceneNote');
      const heartBurst = document.getElementById('heartBurst');
      const message = document.getElementById('message');
      const messageOverlay = document.getElementById('messageOverlay');
      const oneMoreButton = document.getElementById('oneMoreButton');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const messages = [
        "I wish I could be there right now. i'd pull you close, kiss your forehead, and let you tell me everything that happened today. you don't have to keep it all inside, okay? i'm here for you ❤️",
        "i know you've been trying so hard lately. i wish people at work would see just how much effort you put into everything. but even if they don't, i see it. i see you, and i'm so proud of you.",
        "i wish i could hold you close and let you forget about work for a little while. you can tell me everything or say absolutely nothing. i just want you to feel a little better.",
        "i hate knowing that you've been coming home feeling this tired. i wish i could take some of that weight off your shoulders. since i can't fix everything for you, let me at least love you through it. that's something i'll always do.",
        "please don't think you have to be okay just because everyone expects you to be. even the strongest person gets tired. even the most capable person has bad days. you deserve to be looked after too.",
        "i know your boss has been making things difficult lately, and sometimes i wish i could tell him a few things myself. but please remember that the way he treats you doesn't decide your worth. not even a little bit.",
        "you know what i wish for tonight? for you to get some proper rest, have something nice to eat, cuddle with me, and forget about every annoying thing that happened today. just one peaceful evening where you don't have to worry about anything.",
        "i wish you could see what i see when i look at you. not just a hardworking woman who keeps getting things done, but someone with the cutest smile, the softest heart, and a face i could never get tired of kissing.",
        "i know how strong you are, but i want you to know that you can be tired, clingy, upset, or emotional with me. you don't have to hold yourself together all the time. i'll still hold you just as close.",
        "if i were next to you right now, i'd pull you into the biggest hug and probably refuse to let go for a while. then i'd kiss your forehead and ask you to tell me everything that happened today. ❤️",
        "I may not always know how to make things better, but i'll always want to understand what you're going through. you don't need a perfect answer from me. sometimes i'll just hold your hand, listen to you, and remind you that you're not alone.",
        "one bad day at work doesn't get to follow you into every part of your life. when you're with me, you can put it down for a bit. let me make you laugh, annoy you a little, and steal a few kisses until that worried face turns into a smile again.",
        "aadarei, aadarei, aadarei. not just on the days when you're happy and full of energy, but on the days when you're exhausted, irritated, and don't even feel like talking. i love you on those days too. you deserve a little extra love on those days.",
        "i wish i could tell your tired heart that it can rest now. you've done enough for today. you don't need to solve tomorrow's problems tonight. come cuddle with me and just breathe for a while.",
        "i love how much you care about doing your work well, but please don't let the pressure make you forget to take care of yourself too. you matter just as much as everything you're working so hard for.",
        "i wish i could be the person you come home to after a long, horrible day. the person who takes your bag, gives you a hug, listens to your little rant, and reminds you that the world isn't always going to feel this heavy. i want to be that person for you.",
        "you can complain to me about the same thing ten times, okay? 😭 you don't have to worry that you're bothering me. if it's hurting you, i want to hear about it. you don't have to pretend to be okay around me.",
        "i wish i could tuck you into my arms, cover you with a blanket, and give you those tiny forehead kisses you deserve. no work talk, no pressure, no expectations. just you getting all the love you need.",
        "I know i can't always be beside you when things get hard, and that honestly makes me wish for a little more time with you. but even when i'm not there to hug you, please remember that someone cares about your happiness just as much as your achievements.",
        "you know what? you don't have to come to me with a smile every time. come with your tired face, your grumpy face, your teary face, whatever face you've got today. i'll probably kiss it anyway. especially the grumpy one. 😂❤️",
        "i hope you know that i'm on your side. even when you doubt yourself, even when work makes you feel like you're not doing enough, and even when you just want to give up for the day. i'll listen, hold you close, and remind you how much i believe in you.",
        "please eat properly and drink some water today, okay? consider this your virtual boyfriend reminder. i need you to take care of yourself too, not just keep giving everything you have to everyone else. ❤️",
        "sometimes i wish i could take you away from everything that's stressing you out, even if it's just for a day. we'd get your favourite food, walk around together, hold hands, and talk about absolutely nothing important. i miss those peaceful little moments with you.",
        "i hope nobody makes you feel like your best is never enough. i know you put your heart into what you do. and on the days when things still don't go right, you deserve patience and kindness, not even more pressure.",
        "please don't measure yourself by how much you managed to finish today. i'd much rather hear that you got some rest and felt a little happier than hear that you worked yourself to exhaustion trying to please everyone. your health and happiness matter so much to me.",
        "come give me a proper hug, not one of those two-second hugs. the kind where you hide your face against me and i hold you until you forget what you were upset about for a tiny little while. i think we both need one of those. ❤️",
        "even if today was awful, i'm still so glad i get to love you. i get to know your silly little habits, hear your voice, see your smile, and spend time with you. having you in my life is something i never want to take for granted.",
        "i know you're trying your best. you don't need to keep explaining that to me or showing me how much you've done. i believe you. and if all you've got left at the end of today is enough energy for a cuddle, i'll happily take that little cuddle and call it the best part of my day.",

      const openings = [
        'Sudu bole, remember this, ',
        'Mage Manika, keep this close to your heart, ',
        'Sudu Manika, I need you to remember, ',
        'Mage Rattaran, a little reminder from your Pooh, ',
        'Sudu, read this as a cuddle from me, ',
        'Love, your Pooh wants you to remember, ',
        'Baby, let your Pooh remind you, ',
        'Patiyoo, a little hug in words, '
      ];
      const endings = [
        ' Aadarei, mage Sudu Manika. Always, your Pooh bear 🧸💗',
        ' Your Pooh is right here for you, baby. Aadarei. 💗',
        ' Aadarei, Mage Manika. Come back for another cuddle whenever you need one. 🧸',
        ' Always your Pooh bear, my Sudu bole. Aadarei. 💞',
        ' Aadarei, Rattaran. You never have to face everything alone. - your loving Pooh 🧸',
        ' Your Pooh loves every part of you. Aadarei, Sudu. 💗',
        ' Aadarei, Patiyoo. Let your Pooh hold you a little longer. 🧸💞',
        ' Forever your Pooh, my Love. Aadarei. 💗'
      ];

      let positions = { you: { x: 0, y: 0 }, her: { x: 0, y: 0 } };
      let previousMessage = -1;
      let hugging = false;
      let activeDrag = null;
      let startPoint = null;
      let revealTimer = null;

      function setPersonPosition(person, x, y) {
        const item = positions[person.id];
        item.x = x;
        item.y = y;
        person.style.left = `${x}px`;
        person.style.top = `${y}px`;
      }

      function resetPositions(animate = true) {
        if (!animate) {
          you.style.transition = 'none';
          her.style.transition = 'none';
        }
        const width = scene.clientWidth;
        const height = scene.clientHeight;
        setPersonPosition(you, Math.max(you.offsetWidth / 2 + 8, width * .22), height * .51);
        setPersonPosition(her, Math.min(width - her.offsetWidth / 2 - 8, width * .78), height * .51);
        if (!animate) {
          requestAnimationFrame(() => {
            you.style.transition = '';
            her.style.transition = '';
          });
        }
      }

      function randomIndexExceptPrevious(length) {
        let next = Math.floor(Math.random() * length);
        while (length > 1 && next === previousMessage) next = Math.floor(Math.random() * length);
        previousMessage = next;
        return next;
      }

      function randomMessage() {
        const next = randomIndexExceptPrevious(messages.length);
        const opening = openings[Math.floor(Math.random() * openings.length)];
        const ending = endings[Math.floor(Math.random() * endings.length)];
        return `${opening}${messages[next]}${ending}`;
      }

      function createHeartBurst() {
        heartBurst.replaceChildren();
        const hearts = ['♡', '♥', '💕', '♡', '✦', '💗', '♥', '♡', '✨', '💕', '♡', '♥'];
        hearts.forEach((symbol, index) => {
          const heart = document.createElement('span');
          heart.className = 'burst-heart';
          heart.textContent = symbol;
          heart.style.setProperty('--dx', `${Math.round((Math.random() - .5) * 245)}px`);
          heart.style.setProperty('--dy', `${-70 - Math.round(Math.random() * 140)}px`);
          heart.style.setProperty('--delay', `${index * 38}ms`);
          heart.style.setProperty('--heart-size', `${14 + Math.round(Math.random() * 14)}px`);
          heartBurst.appendChild(heart);
        });
      }

      function openMessage() {
        message.textContent = randomMessage();
        messageOverlay.classList.add('is-open');
        messageOverlay.setAttribute('aria-hidden', 'false');
        oneMoreButton.focus({ preventScroll: true });
      }

      function startHug() {
        if (hugging) return;
        hugging = true;
        clearTimeout(revealTimer);
        you.classList.remove('is-moving');
        her.classList.remove('is-moving');
        activeDrag = null;
        scene.classList.add('hugging');
        sceneNote.textContent = 'There you are, Sudu bole 💗';

        const centerX = scene.clientWidth / 2;
        const centerY = scene.clientHeight * .51;
        setPersonPosition(you, centerX - Math.min(27, you.offsetWidth * .20), centerY);
        setPersonPosition(her, centerX + Math.min(27, her.offsetWidth * .20), centerY - 2);
        createHeartBurst();

        // Let the two photos finish their running-in animation before revealing the note.
        revealTimer = window.setTimeout(openMessage, reduceMotion ? 30 : 620);
      }

      function returnToDragPage() {
        clearTimeout(revealTimer);
        scene.classList.remove('hugging');
        messageOverlay.classList.remove('is-open');
        messageOverlay.setAttribute('aria-hidden', 'true');
        heartBurst.replaceChildren();
        sceneNote.textContent = 'Psst… drag either of us closer 💞';
        hugging = false;
        resetPositions(false);
        window.requestAnimationFrame(() => you.focus({ preventScroll: true }));
      }

      function beginDrag(event, person) {
        if (hugging || event.button > 0) return;
        event.preventDefault();
        activeDrag = person;
        const rect = scene.getBoundingClientRect();
        startPoint = { x: event.clientX, y: event.clientY, moved: false };
        const current = positions[person.id];
        person.dragOffsetX = event.clientX - rect.left - current.x;
        person.dragOffsetY = event.clientY - rect.top - current.y;
        person.classList.add('is-moving');
        try { person.setPointerCapture(event.pointerId); } catch (_) {}
      }

      function moveDrag(event, person) {
        if (activeDrag !== person || hugging) return;
        const rect = scene.getBoundingClientRect();
        if (startPoint && Math.hypot(event.clientX - startPoint.x, event.clientY - startPoint.y) > 4) startPoint.moved = true;
        const radius = person.offsetWidth / 2;
        const x = Math.max(radius, Math.min(scene.clientWidth - radius, event.clientX - rect.left - person.dragOffsetX));
        const y = Math.max(radius + 20, Math.min(scene.clientHeight - radius - 8, event.clientY - rect.top - person.dragOffsetY));
        setPersonPosition(person, x, y);
      }

      function endDrag(event, person) {
        if (activeDrag !== person) return;
        person.classList.remove('is-moving');
        const other = person === you ? her : you;
        const a = positions[person.id];
        const b = positions[other.id];
        const closeEnough = Math.hypot(a.x - b.x, a.y - b.y) < (person.offsetWidth + other.offsetWidth) * .43;
        activeDrag = null;
        if (closeEnough && startPoint && startPoint.moved) startHug();
        startPoint = null;
      }

      [you, her].forEach(person => {
        // Fixed local image files: images/pooh.jpg and images/sudu.jpeg.
        const image = person.querySelector('img');
        const showPhoto = () => person.classList.add('has-photo');
        image.addEventListener('load', showPhoto);
        if (image.complete && image.naturalWidth > 0) showPhoto();

        person.addEventListener('pointerdown', event => beginDrag(event, person));
        person.addEventListener('pointermove', event => moveDrag(event, person));
        person.addEventListener('pointerup', event => endDrag(event, person));
        person.addEventListener('pointercancel', event => endDrag(event, person));
        person.addEventListener('keydown', event => {
          if ((event.key === 'Enter' || event.key === ' ') && !hugging) {
            event.preventDefault();
            startHug();
          }
        });
      });

      oneMoreButton.addEventListener('click', returnToDragPage);
      window.addEventListener('resize', () => {
        if (!hugging && !activeDrag) resetPositions(false);
      });

      resetPositions(false);
    })();
  </script>
